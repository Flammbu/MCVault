<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MCVault</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

<div id="editionScreen" class="edition-screen">

    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <div class="welcome">

        <div class="logo">
            MC<span>Vault</span>
        </div>

        <div class="eyebrow">
            THE MINECRAFT CONTENT HUB
        </div>

        <h1>
            Choose your
            <span>Edition</span>
        </h1>

        <p>
            Discover mods, modpacks, resource packs,
            shaders, maps and more.
        </p>

        <div class="edition-grid">

            <button
                class="edition-card"
                onclick="selectEdition('java')"
            >

                <div class="edition-icon">⛏</div>

                <h2>Java Edition</h2>

                <p>
                    Mods · Modpacks · Shaders<br>
                    Resource Packs · Maps
                </p>

                <strong>ENTER →</strong>

            </button>


            <button
                class="edition-card"
                onclick="selectEdition('bedrock')"
            >

                <div class="edition-icon">◆</div>

                <h2>Bedrock Edition</h2>

                <p>
                    Add-ons · Worlds · Packs<br>
                    Skins · Maps
                </p>

                <strong>ENTER →</strong>

            </button>

        </div>

    </div>

</div>


<div id="mainScreen" class="main hidden">

    <header>

        <div class="logo">
            MC<span>Vault</span>
        </div>

        <nav>

            <button onclick="setType('mod')">
                Mods
            </button>

            <button onclick="setType('modpack')">
                Modpacks
            </button>

            <button onclick="setType('resourcepack')">
                Resource Packs
            </button>

            <button onclick="setType('shader')">
                Shaders
            </button>

        </nav>

        <button
            class="change-button"
            onclick="changeEdition()"
        >
            Change Edition
        </button>

    </header>


    <section class="hero">

        <div class="eyebrow" id="editionLabel">
            JAVA EDITION
        </div>

        <h1>
            Everything Minecraft.
            <span>One place.</span>
        </h1>

        <p>
            Find Minecraft content from trusted platforms.
        </p>

        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="Search Minecraft content..."
            >

            <button onclick="search()">
                SEARCH
            </button>

        </div>

    </section>


    <section class="filters">

        <select id="version">
            <option value="">All Versions</option>
            <option>1.21.11</option>
            <option>1.21.10</option>
            <option>1.21.8</option>
            <option>1.21.5</option>
            <option>1.20.1</option>
        </select>


        <select id="loader">
            <option value="">All Loaders</option>
            <option>Fabric</option>
            <option>Forge</option>
            <option>NeoForge</option>
            <option>Quilt</option>
        </select>


        <select id="side">
            <option value="">Client + Server</option>
            <option>Client</option>
            <option>Server</option>
        </select>


        <select id="category">
            <option value="">All Categories</option>
            <option>PvP</option>
            <option>Combat</option>
            <option>Performance</option>
            <option>Utility</option>
            <option>Visual</option>
        </select>

    </section>


    <main class="content">

        <div class="content-header">

            <div>

                <div class="eyebrow">
                    DISCOVER
                </div>

                <h2>
                    Minecraft Projects
                </h2>

            </div>

            <span id="count">
                0 results
            </span>

        </div>


        <div id="loading" class="loading hidden">
            Loading...
        </div>


        <div id="results" class="results"></div>

    </main>

</div>


<script src="./app.js"></script>

</body>
</html>
